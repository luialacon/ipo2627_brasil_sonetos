<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Sonetos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <h1 class="main-title">Antología del Soneto</h1>
            <p class="main-subtitle">14 versos de arte mayor en cuatro estrofas</p>
        </header>

        <nav class="selector-container" aria-label="Selección y búsqueda de sonetos">
            <!-- Barra de Búsqueda -->
            <div class="search-box">
                <label for="sonnet-search" class="selector-label">Buscar por título o autor:</label>
                <div class="search-input-wrapper">
                    <input type="text" id="sonnet-search" class="search-input" placeholder="Escribe 'Quevedo', 'Nariz'..." autocomplete="off">
                    <ul id="search-results" class="search-results-list hidden"></ul>
                </div>
            </div>

            <!-- Desplegable Tradicional -->
            <div class="dropdown-box">
                <label for="sonnet-select" class="selector-label">O selecciona de la lista:</label>
                <select id="sonnet-select" class="sonnet-dropdown"></select>
            </div>
        </nav>

        <main id="sonnet-display" class="sonnet-card"></main>

        <footer class="main-footer">
            <p>&copy; Lector de Sonetos Clásicos — Diseño e Interacción Poética</p>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
